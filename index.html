<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портал Обучения</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-light: #f0f2f5;
            --bg-dark: #1a1a1a;
            --text-light: #24292e;
            --text-dark: #e0e0e0;
            --sidebar-bg-light: #ffffff;
            --sidebar-bg-dark: #2a2a2a;
            --border-light: #d0d7de;
            --border-dark: #3a3a3a;
            --primary-color: #2ea44f; /* GitHub Green */
            --secondary-color: #0366d6; /* GitHub Blue */
            --item-bg-light: #f6f8fa;
            --item-bg-dark: #333333;
            --item-hover-light: #eef0f2;
            --item-hover-dark: #444444;
            --shadow-light: rgba(0,0,0,0.08);
            --shadow-dark: rgba(0,0,0,0.3);
        }

        /* Dark Theme Variables */
        body.dark-theme {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }
        body.dark-theme .sidebar {
            background-color: var(--sidebar-bg-dark);
            border-right-color: var(--border-dark);
            box-shadow: 2px 0 8px var(--shadow-dark);
        }
        body.dark-theme .sidebar h3 {
            color: var(--text-dark);
            border-bottom-color: var(--primary-color);
        }
        body.dark-theme .lesson-item {
            background: var(--item-bg-dark);
            border-color: var(--border-dark);
            color: var(--text-dark);
        }
        body.dark-theme .lesson-item:hover {
            background: var(--item-hover-dark);
            border-color: var(--primary-color);
            box-shadow: 0 2px 4px var(--shadow-dark);
        }
        body.dark-theme .btn-main {
            box-shadow: 0 4px 14px var(--shadow-dark);
        }
        body.dark-theme .btn-secondary {
            color: var(--text-dark);
            background-color: var(--item-bg-dark);
            border-color: var(--border-dark);
        }
        body.dark-theme .btn-secondary:hover {
            background-color: var(--item-hover-dark);
        }
        body.dark-theme .status {
            color: var(--text-dark);
        }
        body.dark-theme #theme-toggle {
            background-color: var(--item-bg-dark);
            color: var(--text-dark);
            border-color: var(--border-dark);
        }
        body.dark-theme #theme-toggle:hover {
            background-color: var(--item-hover-dark);
        }
        body.dark-theme .repo-input-container {
             background-color: var(--item-bg-dark);
             border-color: var(--border-dark);
             color: var(--text-dark);
        }
        body.dark-theme .repo-input-container input {
            background-color: var(--item-bg-dark);
            color: var(--text-dark);
            border-color: var(--border-dark);
        }
        body.dark-theme .repo-input-container button {
            background-color: var(--primary-color);
            color: white;
            border: none;
        }

        /* Base Styles */
        body {
            display: flex;
            margin: 0;
            height: 100vh;
            background-color: var(--bg-light);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Sidebar */
        .sidebar {
            width: 300px; /* Немного шире для лучшего отображения списка */
            background-color: var(--sidebar-bg-light);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            padding: 25px 20px;
            box-shadow: 2px 0 8px var(--shadow-light);
            z-index: 10;
            position: relative; /* Для кнопки темы */
            overflow: hidden; /* Чтобы не вылезали тени при скролле */
        }

        .sidebar h3 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-light);
            margin-top: 0;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary-color);
            text-align: center;
        }

        .lesson-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .lesson-item {
            padding: 12px 15px;
            margin-bottom: 10px;
            background: var(--item-bg-light);
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
            border: 1px solid var(--border-light);
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lesson-item:hover {
            background: var(--item-hover-light);
            border-color: var(--primary-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transform: translateY(-1px);
        }
        .lesson-item::before {
            content: '📚'; /* Иконка книги */
            font-size: 16px;
        }
        .lesson-item:nth-child(even)::before {
            content: '📄'; /* Альтернативная иконка для четных */
        }

        /* Main Content Area */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px; /* Увеличим расстояние между элементами */
            padding: 20px;
            text-align: center;
        }

        .main-content h1 {
            font-size: 3em; /* Большой заголовок */
            color: var(--primary-color);
            margin-bottom: 10px;
            font-weight: 700;
        }
        body.dark-theme .main-content h1 {
            color: var(--primary-color); /* чтобы зеленый всегда был виден */
        }

        .main-content p {
            font-size: 1.2em;
            color: var(--text-light);
            max-width: 600px;
            line-height: 1.6;
        }
        body.dark-theme .main-content p {
            color: var(--text-dark);
        }

        /* Buttons */
        .btn-main {
            padding: 18px 45px; /* Больше padding */
            font-size: 20px;
            font-weight: 600;
            color: white;
            background-color: var(--primary-color);
            border: none;
            border-radius: 10px; /* Чуть более скругленные */
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 16px rgba(46, 164, 79, 0.4);
            letter-spacing: 0.5px;
        }

        .btn-main:hover {
            transform: translateY(-3px);
            background-color: #288f46;
            box-shadow: 0 8px 20px rgba(46, 164, 79, 0.5);
        }
        
        .btn-secondary {
            padding: 12px 25px; /* Чуть больше padding */
            font-size: 15px;
            color: var(--text-light);
            background-color: var(--sidebar-bg-light);
            border: 1.5px solid var(--border-light);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background-color: var(--item-hover-light);
            border-color: var(--secondary-color);
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        /* Status message */
        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            font-style: italic;
            max-width: 80%;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Theme Toggle */
        #theme-toggle {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 8px 12px;
            font-size: 13px;
            background-color: var(--item-bg-light);
            color: var(--text-light);
            border: 1px solid var(--border-light);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #theme-toggle:hover {
            background-color: var(--item-hover-light);
        }

        /* Input for Repo/Folder URL */
        .repo-input-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background-color: var(--item-bg-light);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            width: 100%;
            box-sizing: border-box;
        }
        .repo-input-container label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-light);
        }
        .repo-input-container input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-light);
            border-radius: 5px;
            background-color: var(--sidebar-bg-light);
            color: var(--text-light);
            font-size: 13px;
        }
        .repo-input-container button {
            padding: 8px 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            transition: background-color 0.2s ease;
        }
        .repo-input-container button:hover {
            background-color: #288f46;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>
            <span style="color: var(--primary-color);">📚</span> Мой Портал Обучения
        </h3>

        <div class="repo-input-container">
            <label for="repoUrlInput">Ссылка на репозиторий:</label>
            <input type="text" id="repoUrlInput" placeholder="https://github.com/user/repo">
            
            <label for="folderUrlInput">Ссылка на папку с уроками:</label>
            <input type="text" id="folderUrlInput" placeholder="https://github.com/user/repo/tree/main/lessons">
            
            <button onclick="applyNewConfig()">Применить ссылки</button>
        </div>

        <div class="lesson-list" id="lessonList">
            <div style="padding: 10px; font-size: 13px; color: #666; text-align: center;">Введите ссылки и нажмите "Применить"</div>
        </div>

        <button id="theme-toggle" onclick="toggleTheme()">Переключить тему</button>
    </div>

    <div class="main-content">
        <h1>Добро пожаловать на портал!</h1>
        <p>Здесь вы можете найти свои последние уроки или выбрать любой из списка слева. Мы автоматически находим самый свежий материал.</p>

        <button id="btnNew" class="btn-main" onclick="openFileByDate(0)" disabled>Открыть самый новый урок</button>
        <button id="btnOld" class="btn-secondary" onclick="openFileByDate(1)" disabled>Предыдущий урок</button>
        <div id="status" class="status">Чтобы начать, введите ссылки на репозиторий и папку в панели слева.</div>
    </div>

    <script>
        let config = { owner: '', repo: '', folderPath: '' };

        // --- НАСТРОЙКИ ССЫЛОК (Будут загружаться из localStorage или input) ---
        // Изначально можно установить ссылки по умолчанию, если они не сохранены
        let defaultRepoUrl = "https://github.com/DailyWork-web/test-repository"; 
        let defaultFolderUrl = "https://github.com/DailyWork-web/test-repository/tree/main/%D1%83%D1%80%D0%BE%D0%BA%D0%B8";
        // ------------------------

        // Функция для извлечения данных из ссылок
        function parseGithubUrl(repoUrl, folderUrl) {
            const repoParts = repoUrl.replace(/\/$/, "").split('/');
            const owner = repoParts[repoParts.length - 2];
            const repo = repoParts[repoParts.length - 1];

            const folderMatch = folderUrl.match(/\/tree\/[^\/]+\/(.+)$/);
            const folderPath = folderMatch ? decodeURIComponent(folderMatch[1]) : "";

            return { owner, repo, folderPath };
        }

        // Загрузка сохраненных настроек или дефолтных
        function loadConfig() {
            const savedRepoUrl = localStorage.getItem('repoUrl') || defaultRepoUrl;
            const savedFolderUrl = localStorage.getItem('folderUrl') || defaultFolderUrl;

            document.getElementById('repoUrlInput').value = savedRepoUrl;
            document.getElementById('folderUrlInput').value = savedFolderUrl;
            
            config = parseGithubUrl(savedRepoUrl, savedFolderUrl);
            
            // Если есть валидные ссылки, сразу загружаем
            if (config.owner && config.repo && config.folderPath) {
                loadSidebar();
                document.getElementById('btnNew').disabled = false;
                document.getElementById('btnOld').disabled = false;
                document.getElementById('status').innerText = `Загружены файлы из папки "${config.folderPath.split('/').pop()}"`;
            } else {
                document.getElementById('status').innerText = "Введите корректные ссылки GitHub для загрузки уроков.";
                document.getElementById('lessonList').innerHTML = '<div style="padding: 10px; font-size: 13px; color: #666; text-align: center;">Введите ссылки и нажмите "Применить"</div>';
            }
        }

        // Применение новых ссылок из инпутов
        function applyNewConfig() {
            const repoUrl = document.getElementById('repoUrlInput').value;
            const folderUrl = document.getElementById('folderUrlInput').value;

            if (!repoUrl || !folderUrl) {
                alert('Пожалуйста, введите обе ссылки.');
                return;
            }

            localStorage.setItem('repoUrl', repoUrl);
            localStorage.setItem('folderUrl', folderUrl);
            
            config = parseGithubUrl(repoUrl, folderUrl);
            loadSidebar();
            document.getElementById('btnNew').disabled = false;
            document.getElementById('btnOld').disabled = false;
            document.getElementById('status').innerText = `Загружены файлы из папки "${config.folderPath.split('/').pop()}"`;
        }

        // 1. Загрузка боковой панели
        async function loadSidebar() {
            const listDiv = document.getElementById('lessonList');
            listDiv.innerHTML = '<div style="padding: 10px; font-size: 13px; color: #666; text-align: center;">Загрузка списка уроков...</div>'; // Индикатор загрузки

            if (!config.owner || !config.repo || !config.folderPath) {
                listDiv.innerHTML = '<div style="padding: 10px; font-size: 13px; color: #cf222e; text-align: center;">Некорректные ссылки!</div>';
                return;
            }

            try {
                const res = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${encodeURIComponent(config.folderPath)}`);
                
                if (!res.ok) {
                    if (res.status === 404) {
                        listDiv.innerHTML = '<div style="padding: 10px; font-size: 13px; color: #cf222e; text-align: center;">Папка с уроками не найдена или неправильная ссылка на папку.</div>';
                    } else {
                        throw new Error(`Ошибка GitHub API: ${res.status}`);
                    }
                    return;
                }
                
                const files = await res.json();
                
                listDiv.innerHTML = ''; // Очистка
                files.filter(f => f.type === 'file').forEach(file => {
                    const div = document.createElement('div');
                    div.className = 'lesson-item';
                    div.innerText = file.name;
                    div.onclick = () => window.open(file.download_url, '_blank');
                    listDiv.appendChild(div);
                });

                if (files.filter(f => f.type === 'file').length === 0) {
                     listDiv.innerHTML = '<div style="padding: 10px; font-size: 13px; color: #666; text-align: center;">В папке пока нет уроков.</div>';
                }

            } catch (e) {
                console.error("Ошибка загрузки sidebar:", e);
                listDiv.innerHTML = `<div style="padding: 10px; font-size: 13px; color: #cf222e; text-align: center;">Ошибка загрузки: ${e.message || "проверьте ссылки."}</div>`;
            }
        }

        // 2. Поиск по дате (через коммиты)
        async function openFileByDate(index) {
            const statusDiv = document.getElementById('status');
            const buttons = document.querySelectorAll('button');
            buttons.forEach(b => b.disabled = true);
            statusDiv.innerText = "Ищу последние изменения в истории...";

            if (!config.owner || !config.repo || !config.folderPath) {
                statusDiv.innerText = "Пожалуйста, введите корректные ссылки на репозиторий и папку.";
                buttons.forEach(b => b.disabled = false);
                return;
            }

            try {
                const res = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/commits?path=${encodeURIComponent(config.folderPath)}&per_page=10`);
                if (!res.ok) throw new Error(`Ошибка GitHub API: ${res.status}`);
                const commits = await res.json();
                
                const foundFiles = new Set();
                const orderedFiles = [];

                for (const commit of commits) {
                    const detail = await (await fetch(commit.url)).json();
                    for (const file of detail.files) {
                        if (file.filename.startsWith(config.folderPath) && !foundFiles.has(file.filename)) {
                            foundFiles.add(file.filename);
                            orderedFiles.push(file);
                        }
                    }
                    if (orderedFiles.length > index + 1) break;
                }

                if (orderedFiles[index]) {
                    window.open(orderedFiles[index].raw_url, '_blank');
                    statusDiv.innerText = `Открыт файл: "${orderedFiles[index].filename.split('/').pop()}"`;
                } else {
                    statusDiv.innerText = "Файл не найден в истории изменений. Возможно, нет предыдущих.";
                }
            } catch (e) {
                console.error("Ошибка при поиске по дате:", e);
                statusDiv.innerText = `Ошибка доступа к GitHub API: ${e.message || "проверьте сеть."}`;
            } finally {
                buttons.forEach(b => b.disabled = false);
            }
        }

        // Theme Toggle Logic
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-toggle').innerText = isDark ? 'Светлая тема' : 'Тёмная тема';
        }

        // Apply saved theme on load
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
            }
            document.getElementById('theme-toggle').innerText = savedTheme === 'dark' ? 'Светлая тема' : 'Тёмная тема';
        }

        // Initial setup on page load
        loadTheme();
        loadConfig();
    </script>
</body>
</html>
