<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умные Уроки</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: 'Segoe UI', sans-serif;
            gap: 15px;
        }

        .btn-main {
            padding: 15px 35px;
            font-size: 18px;
            color: white;
            background-color: #2ea44f;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(46, 164, 79, 0.3);
        }

        .btn-main:hover { background-color: #2c974b; transform: translateY(-2px); }

        .btn-secondary {
            padding: 8px 16px;
            font-size: 13px;
            color: #000;
            background-color: #ffffff;
            border: 1.5px solid #000000;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover { background-color: #f5f5f5; }

        .status { margin-top: 10px; font-size: 13px; color: #666; text-align: center; max-width: 80%; }
        
        button:disabled { opacity: 0.5; cursor: wait; }
    </style>
</head>
<body>

    <button id="btnNew" class="btn-main" onclick="openFileByDate(0)">Открыть самый новый файл</button>
    <button id="btnOld" class="btn-secondary" onclick="openFileByDate(1)">Открыть прошлый файл</button>
    
    <div id="status" class="status">Названия файлов не важны, ищу по дате...</div>

    <script>
        const OWNER = 'DailyWork-web';
        const REPO = 'test-repository';

        async function openFileByDate(index) {
            const statusDiv = document.getElementById('status');
            const buttons = document.querySelectorAll('button');
            
            // Блокируем кнопки на время загрузки
            buttons.forEach(b => b.disabled = true);
            statusDiv.innerText = "Анализирую историю обновлений...";

            try {
                // 1. Получаем список коммитов (событий изменения файлов)
                // Это вернет список изменений, начиная с самых свежих
                const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/commits?per_page=20`);
                if (!response.ok) throw new Error('Ошибка доступа к API');
                
                const commits = await response.json();
                const foundFiles = new Set();
                const orderedFiles = [];

                // 2. Идем по истории изменений и собираем уникальные файлы
                for (const commit of commits) {
                    const detailResponse = await fetch(commit.url);
                    const detailData = await detailResponse.json();
                    
                    for (const file of detailData.files) {
                        // Игнорируем index.html и удаленные файлы
                        if (file.filename !== 'index.html' && file.status !== 'removed' && !foundFiles.has(file.filename)) {
                            foundFiles.add(file.filename);
                            orderedFiles.push(file);
                        }
                        // Если нашли достаточно файлов, прерываем поиск
                        if (orderedFiles.length > index + 1) break;
                    }
                    if (orderedFiles.length > index + 1) break;
                }

                if (orderedFiles.length > index) {
                    const targetFile = orderedFiles[index];
                    window.open(targetFile.raw_url, '_blank');
                    statusDiv.innerText = "Открыт: " + targetFile.filename;
                } else {
                    statusDiv.innerText = "Файл не найден в истории изменений";
                }

            } catch (error) {
                statusDiv.innerText = "Ошибка: Лимит запросов GitHub или нет сети";
                console.error(error);
            } finally {
                buttons.forEach(b => b.disabled = false);
            }
        }
    </script>

</body>
</html>
